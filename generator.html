<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
            padding: 30px;
        }

        .card {
            border-radius: 20px;
            border: none;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        .table-responsive {
            max-height: 500px;
            overflow-y: auto;
        }

        .link-cell {
            max-width: 450px;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card shadow p-4">

            <h2 class="mb-3">
                💌 Generator Link Undangan
            </h2>

            <p class="text-muted">
                Format:
                nomor,nama
            </p>

            <div class="mb-3">
                <label class="form-label">
                    Base URL Undangan
                </label>

                <input type="text" class="form-control" id="baseUrl" value="https://wed.achmadfhbw.my.id">
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Data Tamu
                </label>

                <textarea class="form-control" id="guestList" placeholder="Contoh:
08123456789,Fakhri & Partner
08222222222,Fairuz & Partner"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Import CSV (Opsional)
                </label>

                <input type="file" id="csvFile" class="form-control" accept=".csv">

                <small class="text-muted">
                    Format CSV:
                    nomor,nama
                </small>
            </div>

            <div class="d-flex gap-2 flex-wrap">

                <button class="btn btn-primary" onclick="generateLinks()">

                    Generate Link

                </button>

                <button class="btn btn-success" onclick="downloadCSV()">

                    Download CSV

                </button>

            </div>

            <hr>

            <div class="table-responsive">

                <table class="table table-bordered table-hover align-middle">

                    <thead class="table-light">

                        <tr>
                            <th>No</th>
                            <th>Nomor WA</th>
                            <th>Nama Tamu</th>
                            <th>Link</th>
                            <th>Aksi</th>
                        </tr>

                    </thead>

                    <tbody id="resultBody"></tbody>

                </table>

            </div>

        </div>
    </div>

    <script>
        let generatedData = [];

        document
            .getElementById('csvFile')
            .addEventListener(
                'change',
                function (event) {

                    const file =
                        event.target.files[0];

                    if (!file) return;

                    const reader =
                        new FileReader();

                    reader.onload =
                        function (e) {

                            const rows =
                                e.target.result
                                .split(/\r?\n/)
                                .map(row =>
                                    row.trim()
                                )
                                .filter(Boolean);

                            document
                                .getElementById(
                                    'guestList'
                                )
                                .value =
                                rows.join('\n');

                            // reset hasil lama
                            generatedData = [];

                            document
                                .getElementById(
                                    'resultBody'
                                )
                                .innerHTML = '';

                            // auto generate lagi
                            generateLinks();

                            alert(
                                'CSV berhasil dimuat 😆'
                            );
                        };

                    reader.readAsText(file);

                    // reset input file
                    event.target.value =
                        '';
                });

        function generateLinks() {

            const baseUrl =
                document
                .getElementById(
                    'baseUrl'
                )
                .value
                .trim()
                .replace(/\/$/, '');

            const rows =
                document
                .getElementById(
                    'guestList'
                )
                .value
                .split('\n')
                .map(row =>
                    row.trim()
                )
                .filter(Boolean);

            const tbody =
                document
                .getElementById(
                    'resultBody'
                );

            tbody.innerHTML = '';

            generatedData = [];

            rows.forEach(
                (row, index) => {

                    const parts =
                        row.split(',');

                    if (
                        parts.length < 2
                    ) return;

                    let nomor =
                        parts[0]
                        .replace(/\D/g, '')
                        .trim();

                    const guest =
                        parts
                        .slice(1)
                        .join(',')
                        .replace(/^"|"$/g, '')
                        .trim();

                    // otomatis 08 -> 628
                    if (
                        nomor.startsWith('08')
                    ) {

                        nomor =
                            '62' +
                            nomor.slice(1);
                    }

                    const encoded =
                        encodeURIComponent(
                            guest
                        );

                    const link =
                        `${baseUrl}/?to=${encoded}`;

                    const message =
                        `Assalamualaikum Warahmatullahi Wabarakatuh

Kepada Yth.
Bapak/Ibu/Saudara/i

${guest}

Dengan penuh kebahagiaan kami mengundang Anda untuk hadir di acara pernikahan kami 😊

Silakan untuk dapat membuka undangan melalui link berikut:
${link}`;

                    const waLink =
                        `https://wa.me/${nomor}?text=${encodeURIComponent(message)}`;

                    generatedData.push({
                        nomor,
                        nama: guest,
                        link
                    });

                    tbody.innerHTML += `
            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${nomor}
                </td>

                <td>
                    ${guest}
                </td>

                <td class="link-cell">

                    <a
                        href="${link}"
                        target="_blank">

                        ${link}

                    </a>

                </td>

                <td
                class="d-flex gap-2 flex-wrap">

                    <button
                        class="btn btn-sm btn-primary"
                        onclick="copyLink('${link}')">

                        Copy

                    </button>

                    <a
                        href="${waLink}"
                        target="_blank"
                        class="btn btn-sm btn-success">

                        WA

                    </a>

                </td>

            </tr>
        `;
                });
        }

        function copyLink(link) {

            navigator
                .clipboard
                .writeText(link);

            alert(
                'Link berhasil dicopy 😆'
            );
        }

        function downloadCSV() {

            if (
                !generatedData.length
            ) {

                alert(
                    'Generate dulu ya 😭'
                );

                return;
            }

            let csv =
                'Nomor WA,Nama Tamu,Link\n';

            generatedData
                .forEach(item => {

                    csv +=
                        `"${item.nomor}","${item.nama}","${item.link}"\n`;

                });

            const blob =
                new Blob(
                    [csv], {
                        type: 'text/csv;charset=utf-8;'
                    }
                );

            const url =
                URL.createObjectURL(
                    blob
                );

            const a =
                document
                .createElement('a');

            a.href = url;
            a.download =
                'hasil-undangan.csv';

            a.click();

            URL.revokeObjectURL(
                url
            );
        }
    </script>

</body>
    
</html>
